name: 2blog

services:
  # postgres/redis/minio bind published ports to 127.0.0.1 only, not 0.0.0.0
  # — api/worker still reach them over the compose-internal network
  # regardless (unaffected by this), but a VPS's public interface no longer
  # exposes the DB/cache/object-store directly to the internet. `pnpm dev`
  # (README "Kurulum") still works unchanged since it also runs on
  # localhost. Need to poke one from your own machine on the VPS?
  # `ssh -L 5432:localhost:5432 ...` tunnel.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-twoblog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO moved their official image off Docker Hub (minio/minio is gone
    # there — confirmed via Docker Hub's API returning "object not found")
    # to Quay.io; their own current docs use quay.io/minio/minio.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    # AI_OLLAMA_BASE_URL=http://host.docker.internal:... (a VPS-hosted Ollama
    # running outside the compose network) only resolves on Linux Docker
    # Engine with this explicit mapping — it's automatic on Docker Desktop
    # but not here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "4000"

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set in .env}
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - api
    expose:
      - "3000"

  admin:
    build:
      context: ..
      dockerfile: infrastructure/docker/admin.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - api
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # IP-only for now (no domain yet), so Caddy serves plain HTTP on three
    # distinct ports instead of doing domain-based routing + auto-HTTPS.
    # Once a domain exists, switch Caddyfile to the domain-based blocks and
    # change this back to "80:80" / "443:443" — see infrastructure/caddy/Caddyfile.
    ports:
      - "80:80"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
